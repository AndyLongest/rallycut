    *{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}

    @media(max-width:500px){main{padding:16px}h1{font-size:22px}.table th,.table td{padding:8px 6px}}

name: source-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt -e ".[test]"
      - run: python -m pytest -q
        # Media tests may skip without FFmpeg; CI is not video accuracy validation.
